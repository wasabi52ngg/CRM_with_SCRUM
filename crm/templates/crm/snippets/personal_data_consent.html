{% load static %}
{# Чекбокс согласия на обработку ПДн (152-ФЗ). Передайте field=form.personal_data_consent #}
<div class="pd-consent input-box{% if field.errors %} pd-consent--invalid{% endif %}">
  <label class="pd-consent__label" for="{{ field.id_for_label }}">
    {{ field }}
    <span class="pd-consent__text">
      Я даю своё <strong>согласие</strong> на обработку моих персональных данных
      (фамилия, имя, адрес электронной почты, номер телефона, фотография — при загрузке)
      в целях регистрации и использования сервиса IT CRM, в соответствии с
      <a href="{% url 'crm:privacy_policy' %}" target="_blank" rel="noopener noreferrer">Политикой обработки персональных данных</a>
      и Федеральным законом от 27.07.2006 №&nbsp;152-ФЗ «О персональных данных».
      Согласие может быть отозвано путём направления обращения оператору по контактам,
      указанным в политике.
    </span>
  </label>
  {% if field.errors %}
  <div class="field-errors">
    <ul>
      {% for error in field.errors %}
      <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
